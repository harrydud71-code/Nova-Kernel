name: NovaKernel A52s Build Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/main.yml'
      - 'build_kernel.sh'
      - 'arch/arm64/**'
      - 'drivers/**'
      - 'fs/**'
      - 'include/**'
      - 'kernel/**'
      - 'Makefile'
  workflow_dispatch:
    inputs:
      device:
        description: "Target device"
        required: true
        default: "a52sxq"
        type: choice
        options:
          - a52sxq

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential flex git libelf-dev libssl-dev lld make python3 python-is-python3 rsync clang-11 llvm-11 lld-11
          sudo apt-get install -y device-tree-compiler libncurses-dev zlib1g-dev

      - name: Verify target configuration and root integration status
        run: |
          test -f arch/arm64/configs/vendor/a52sxq_eur_open_defconfig
          echo "Target defconfig exists: vendor/a52sxq_eur_open_defconfig"
          if grep -R -n -E 'CONFIG_KSU=y|CONFIG_KSU_SUSFS=y|CONFIG_KSU_SUSFS' --include='Kconfig' --include='Makefile' --include='*.c' --include='*.h' --include='*defconfig' .; then
            echo "Found possible KernelSU/SUSFS references; inspect build output before packaging."
          else
            echo "::warning::No obvious in-tree KernelSU/SUSFS integration found. This run validates the A52s kernel build only; it will NOT create a flashable ZIP."
          fi

      - name: Verify Clang toolchain
        run: |
          set -euo pipefail
          clang-11 --version
          ld.lld-11 --version

      - name: Configure A52s kernel
        run: |
          set -euo pipefail
          export ARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          export CC=clang-11
          export LD=ld.lld-11
          make O=out vendor/a52sxq_eur_open_defconfig
          grep -E 'CONFIG_(SEC_A52SXQ_PROJECT|MACH_A52SXQ_EUR_OPEN)=' out/.config

      - name: Compile kernel
        run: |
          set -euo pipefail
          export ARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          export CC=clang-11
          export LD=ld.lld-11
          make -j"$(nproc)" O=out
          test -s out/arch/arm64/boot/Image
          file out/arch/arm64/boot/Image
          cp out/arch/arm64/boot/Image "$RUNNER_TEMP/Image-a52sxq"

      - name: Upload validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: NovaKernel-A52sxq-Image-BUILD-TEST
          path: ${{ runner.temp }}/Image-a52sxq
          if-no-files-found: error
          retention-days: 7
