
name: Full Kernel Build (GKI + KSU)

on:
  workflow_dispatch:
    inputs:
      device:
        description: "Device codename"
        required: true
        default: "a52sxq"
        type: choice
        options:
          - a52sxq
          - a73xq
          - m52xq

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate selected device configuration
        env:
          DEVICE: ${{ inputs.device }}
        run: |
          set -eu

          echo "Selected device: $DEVICE"

          case "$DEVICE" in
            a52sxq)
              CONFIG="arch/arm64/configs/vendor/a52sxq_eur_open_defconfig"
              ;;
            a73xq)
              CONFIG="arch/arm64/configs/vendor/a73xq_eur_open_defconfig"
              ;;
            m52xq)
              CONFIG="arch/arm64/configs/vendor/m52xq_eur_open_defconfig"
              ;;
            *)
              echo "Unsupported device: $DEVICE"
              exit 1
              ;;
          esac

          if [ ! -f "$CONFIG" ]; then
            echo "::error::Missing device config: $CONFIG"
            echo "Checking available config files:"
            find arch/arm64/configs -iname "*${DEVICE}*" -print
            exit 1
          fi

          echo "Found device config: $CONFIG"
          echo "Validation passed."
